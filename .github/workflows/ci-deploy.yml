name: CI and Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      AI_PROVIDER: mock
      DOCKERHUB_NAME: ${{ secrets.DOCKERHUB_NAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      IMAGE_NAME: project-myg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: docker build -t project-myg:${{ github.sha }} .

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.DOCKERHUB_NAME != '' && env.DOCKER_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_NAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && env.DOCKERHUB_NAME != '' && env.DOCKER_TOKEN != ''
        run: |
          docker tag project-myg:${{ github.sha }} "${DOCKERHUB_NAME}/${IMAGE_NAME}:${{ github.sha }}"
          docker tag project-myg:${{ github.sha }} "${DOCKERHUB_NAME}/${IMAGE_NAME}:latest"
          docker push "${DOCKERHUB_NAME}/${IMAGE_NAME}:${{ github.sha }}"
          docker push "${DOCKERHUB_NAME}/${IMAGE_NAME}:latest"

  deploy:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      APP_URL: ${{ secrets.APP_URL }}
      DOCKERHUB_NAME: ${{ secrets.DOCKERHUB_NAME }}
    steps:
      - name: Deploy to VPS
        if: env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_APP_DIR != '' && env.APP_URL != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.VPS_APP_DIR }}"
            git pull --ff-only
            printf '%s\n' "${{ secrets.APP_ENV }}" > .env
            if [ -n "${{ secrets.DOCKERHUB_NAME }}" ]; then
              printf '\nDOCKER_IMAGE=%s/project-myg:latest\n' "${{ secrets.DOCKERHUB_NAME }}" >> .env
              docker compose pull project-myg || true
              docker compose up -d
            else
              docker compose up -d --build
            fi
            docker compose ps
            curl -fsS "${{ secrets.APP_URL }}/api/health"

      - name: Skip deployment when secrets are missing
        if: env.VPS_HOST == '' || env.VPS_USER == '' || env.VPS_SSH_KEY == '' || env.VPS_APP_DIR == '' || env.APP_URL == ''
        run: echo "VPS deployment skipped because one or more deployment secrets are missing."
